<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mora Mustangs - Weather & Presentations</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@300;400;600;700;900&family=Zilla+Slab:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --mps-blue: #003DA5;
            --mps-gray: #A2AAAD;
            --mps-white: #FFFFFF;
            --mps-black: #2D2926;
            --accent-cyan: #00E5FF;
            --accent-amber: #FFB300;
            --gradient-primary: linear-gradient(135deg, #003DA5 0%, #0052E6 50%, #00E5FF 100%);
            --gradient-secondary: linear-gradient(45deg, #FFB300 0%, #FF8F00 100%);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        body {
            font-family: 'Orbitron', monospace;
            background: var(--mps-blue);
            background-image: 
                radial-gradient(circle at 25% 25%, rgba(0, 229, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, rgba(255, 179, 0, 0.08) 0%, transparent 50%),
                linear-gradient(135deg, #003DA5 0%, #001B47 100%);
            height: 100vh;
            cursor: none;
            overflow: hidden;
            position: relative;
        }

        /* Animated background particles */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, rgba(255, 255, 255, 0.2), transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(0, 229, 255, 0.3), transparent),
                radial-gradient(1px 1px at 90px 40px, rgba(255, 179, 0, 0.2), transparent),
                radial-gradient(1px 1px at 130px 80px, rgba(255, 255, 255, 0.1), transparent);
            background-repeat: repeat;
            background-size: 200px 200px;
            animation: drift 20s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes drift {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-200px, -200px); }
        }

        /* Main layout container */
        .main-container {
            display: flex;
            height: 100vh;
            position: relative;
            z-index: 1;
            transition: flex-direction 1s ease-in-out;
        }

        .main-container.layout-sidebar-left {
            flex-direction: row;
        }

        .main-container.layout-sidebar-right {
            flex-direction: row-reverse;
        }

        /* Weather sidebar styles */
        .weather-sidebar {
            width: 400px;
            display: flex;
            flex-direction: column;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--glass-border);
            position: relative;
            overflow: hidden;
        }

        .layout-sidebar-right .weather-sidebar {
            border-right: none;
            border-left: 1px solid var(--glass-border);
        }

        .weather-sidebar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--gradient-primary);
            opacity: 0.05;
            z-index: -1;
        }

        /* Header with MPS Branding */
        .header {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            padding: 15px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--gradient-primary);
            opacity: 0.1;
            z-index: -1;
        }

        .school-title {
            font-family: 'Zilla Slab', serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--mps-white);
            margin-bottom: 5px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            letter-spacing: 1px;
        }

        .tagline {
            font-size: 0.65rem;
            color: var(--accent-cyan);
            font-weight: 300;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Main Content Area */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 15px;
            gap: 15px;
            overflow-y: auto;
        }

        /* Time Display Section */
        .time-section {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 20px 15px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .time-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--gradient-secondary);
            opacity: 0.05;
            z-index: -1;
        }

        .time-display {
            font-size: 3.2rem;
            font-weight: 900;
            color: var(--mps-white);
            margin-bottom: 8px;
            text-shadow: 
                0 0 20px rgba(0, 229, 255, 0.6),
                0 0 40px rgba(0, 229, 255, 0.4),
                0 4px 15px rgba(0, 0, 0, 0.8);
            letter-spacing: 2px;
            line-height: 1;
            animation: pulse 3s ease-in-out infinite;
            position: relative;
        }

        .time-ampm {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--accent-cyan);
            position: absolute;
            top: 0.3rem;
            margin-left: 6px;
            text-shadow: 
                0 0 10px rgba(0, 229, 255, 0.5),
                0 2px 8px rgba(0, 0, 0, 0.6);
        }

        @keyframes pulse {
            0%, 100% { 
                text-shadow: 
                    0 0 20px rgba(0, 229, 255, 0.6),
                    0 0 40px rgba(0, 229, 255, 0.4),
                    0 4px 15px rgba(0, 0, 0, 0.8);
            }
            50% { 
                text-shadow: 
                    0 0 30px rgba(0, 229, 255, 0.8),
                    0 0 60px rgba(0, 229, 255, 0.6),
                    0 4px 15px rgba(0, 0, 0, 0.8);
            }
        }

        .date-display {
            color: var(--accent-amber);
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 5px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .day-display {
            color: var(--mps-gray);
            font-size: 0.9rem;
            font-weight: 400;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Weather Section */
        .weather-section {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 20px 15px;
            position: relative;
            overflow: hidden;
            flex: 1;
        }

        .weather-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--gradient-primary);
            opacity: 0.03;
            z-index: -1;
        }

        .weather-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .location-name {
            font-family: 'Zilla Slab', serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--mps-white);
            margin-bottom: 8px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
            letter-spacing: 0.5px;
        }

        .status-indicator {
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--accent-cyan);
            letter-spacing: 1px;
            text-transform: uppercase;
            background: rgba(0, 229, 255, 0.1);
            padding: 4px 8px;
            border-radius: 8px;
            border: 1px solid rgba(0, 229, 255, 0.2);
            display: inline-block;
        }

        .weather-main {
            text-align: center;
            margin-bottom: 20px;
        }

        .weather-icon {
            font-size: 3rem;
            margin-bottom: 10px;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));
        }

        .temp-display {
            font-size: 2.8rem;
            font-weight: 900;
            color: var(--mps-white);
            margin-bottom: 8px;
            text-shadow: 0 3px 12px rgba(0, 0, 0, 0.7);
            position: relative;
        }

        .temp-display::after {
            content: '°F';
            font-size: 1.2rem;
            position: absolute;
            top: 0.2rem;
            margin-left: 3px;
            color: var(--accent-cyan);
        }

        .condition-text {
            color: var(--accent-amber);
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 5px;
            text-transform: capitalize;
        }

        .feels-like {
            color: var(--mps-gray);
            font-size: 0.8rem;
            font-weight: 400;
        }

        .weather-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .detail-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 12px 8px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .detail-label {
            color: var(--mps-gray);
            font-size: 0.65rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .detail-value {
            color: var(--mps-white);
            font-size: 0.9rem;
            font-weight: 600;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
        }

        .loading, .error {
            text-align: center;
            color: var(--mps-gray);
            font-size: 0.9rem;
            padding: 20px;
            font-style: italic;
        }

        .error {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid rgba(255, 107, 107, 0.2);
            border-radius: 10px;
        }

        .footer {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--glass-border);
            padding: 8px 15px;
            text-align: center;
        }

        .footer-text {
            color: var(--mps-gray);
            font-size: 0.65rem;
            font-weight: 300;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Slideshow main area */
        .slideshow-main {
            flex: 1;
            background: var(--mps-black);
            position: relative;
        }

        .slideshow-main iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Layout switch indicator */
        .layout-indicator {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: var(--accent-cyan);
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.7rem;
            font-weight: 600;
            z-index: 1000;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 229, 255, 0.3);
        }

        /* Responsive adjustments */
        @media (max-width: 1400px) {
            .weather-sidebar {
                width: 350px;
            }
            
            .time-display {
                font-size: 2.8rem;
            }
            
            .temp-display {
                font-size: 2.4rem;
            }
        }

        @media (max-width: 1200px) {
            .weather-sidebar {
                width: 320px;
            }
            
            .school-title {
                font-size: 1.2rem;
            }
            
            .time-display {
                font-size: 2.4rem;
            }
            
            .weather-details {
                grid-template-columns: 1fr;
                gap: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="layout-indicator" id="layoutIndicator">SIDEBAR LEFT • Next switch in <span id="countdown">20:00</span></div>
    
    <div class="main-container layout-sidebar-left" id="mainContainer">
        <div class="weather-sidebar">
            <div class="header">
                <h1 class="school-title">MORA MUSTANGS</h1>
                <p class="tagline">Exploring • Engaging • Empowering</p>
            </div>

            <div class="main-content">
                <div class="time-section">
                    <div class="time-display" id="timeDisplay">00:00 AM</div>
                    <div class="date-display" id="dateDisplay">Loading...</div>
                    <div class="day-display" id="dayDisplay">Loading...</div>
                </div>

                <div class="weather-section">
                    <div class="weather-header">
                        <div class="location-name">Mora, Minnesota</div>
                        <div class="status-indicator" id="statusIndicator">CONNECTING</div>
                    </div>

                    <div id="weatherContent">
                        <div class="loading">Connecting to weather service...</div>
                    </div>
                </div>
            </div>

            <div class="footer">
                <div class="footer-text">MPS Technology Department</div>
            </div>
        </div>

        <div class="slideshow-main">
            <iframe src="https://docs.google.com/presentation/d/e/2PACX-1vSIz_6lj04GsIs9RVXWv5AAXCR5SRwPg8Yuz3bThGWCDjlalCphGpaMgrwERfg7J3ELlV_Niqla7x7O/embed?start=true&loop=true&delayms=15000" 
                    allowfullscreen="true" 
                    mozallowfullscreen="true" 
                    webkitallowfullscreen="true">
            </iframe>
        </div>
    </div>

    <script>
        const CONFIG = {
            WEATHER_DATA_URL: './weather-data.json',
            WEATHER_UPDATE_INTERVAL: 300000, // 5 minutes
            TIME_UPDATE_INTERVAL: 1000, // 1 second
            LAYOUT_SWITCH_INTERVAL: 1200000, // 20 minutes
        };

        const weatherIcons = {
            '01d': '☀️', '01n': '🌙',
            '02d': '⛅', '02n': '☁️',
            '03d': '☁️', '03n': '☁️',
            '04d': '☁️', '04n': '☁️',
            '09d': '🌧️', '09n': '🌧️',
            '10d': '🌦️', '10n': '🌧️',
            '11d': '⛈️', '11n': '⛈️',
            '13d': '❄️', '13n': '❄️',
            '50d': '🌫️', '50n': '🌫️'
        };

        let isRightLayout = false;
        let layoutTimer;
        let countdownTimer;
        let timeRemaining = CONFIG.LAYOUT_SWITCH_INTERVAL / 1000; // in seconds

        // Update time display
        function updateTime() {
            const now = new Date();

            let hours = now.getHours();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            const minutes = String(now.getMinutes()).padStart(2, '0');

            document.getElementById('timeDisplay').innerHTML = `${hours}:${minutes}<span class="time-ampm">${ampm}</span>`;

            const monthDayYear = now.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
            const weekday = now.toLocaleDateString('en-US', { weekday: 'long' });
            
            document.getElementById('dateDisplay').textContent = monthDayYear;
            document.getElementById('dayDisplay').textContent = weekday;
        }

        // Switch layout between sidebar left and right
        function switchLayout() {
            const container = document.getElementById('mainContainer');
            const indicator = document.getElementById('layoutIndicator');
            
            if (isRightLayout) {
                container.classList.remove('layout-sidebar-right');
                container.classList.add('layout-sidebar-left');
                indicator.innerHTML = 'SIDEBAR LEFT • Next switch in <span id="countdown">20:00</span>';
                isRightLayout = false;
            } else {
                container.classList.remove('layout-sidebar-left');
                container.classList.add('layout-sidebar-right');
                indicator.innerHTML = 'SIDEBAR RIGHT • Next switch in <span id="countdown">20:00</span>';
                isRightLayout = true;
            }
            
            // Reset countdown
            timeRemaining = CONFIG.LAYOUT_SWITCH_INTERVAL / 1000;
            console.log(`Layout switched to: ${isRightLayout ? 'RIGHT' : 'LEFT'}`);
        }

        // Update countdown display
        function updateCountdown() {
            const minutes = Math.floor(timeRemaining / 60);
            const seconds = timeRemaining % 60;
            const display = `${minutes}:${String(seconds).padStart(2, '0')}`;
            
            const countdownElement = document.getElementById('countdown');
            if (countdownElement) {
                countdownElement.textContent = display;
            }
            
            timeRemaining--;
            
            if (timeRemaining < 0) {
                timeRemaining = CONFIG.LAYOUT_SWITCH_INTERVAL / 1000;
            }
        }

        // Fetch and display weather
        async function fetchWeatherData() {
            try {
                const url = `${CONFIG.WEATHER_DATA_URL}?t=${Date.now()}`;
                
                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json',
                        'Cache-Control': 'no-cache'
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const weatherResponse = await response.json();
                updateStatusIndicator(weatherResponse);
                
                if (!weatherResponse.success) {
                    throw new Error(weatherResponse.error || 'Weather service error');
                }
                
                displayWeatherData(weatherResponse.data);
                
            } catch (error) {
                console.error('Error fetching weather:', error);
                updateStatusIndicator({ success: false });
                
                let errorMessage = 'Weather service unavailable.';
                if (error.message.includes('404')) {
                    errorMessage += ' GitHub Actions setting up...';
                }
                
                document.getElementById('weatherContent').innerHTML = 
                    `<div class="error">${errorMessage}</div>`;
            }
        }

        // Update status indicator
        function updateStatusIndicator(response) {
            const indicator = document.getElementById('statusIndicator');
            
            if (response.success) {
                if (response.cached && response.stale) {
                    indicator.textContent = 'STALE DATA';
                } else if (response.cached) {
                    indicator.textContent = 'CACHED';
                } else {
                    indicator.textContent = 'LIVE';
                }
            } else {
                indicator.textContent = 'ERROR';
            }
        }

        // Display weather data
        function displayWeatherData(data) {
            const icon = weatherIcons[data.weather[0].icon] || '🌤️';
            const temp = Math.round(data.main.temp);
            const feelsLike = Math.round(data.main.feels_like);
            const humidity = data.main.humidity;
            const windSpeed = Math.round(data.wind.speed);
            const visibility = Math.round(data.visibility / 1609.34 * 10) / 10;
            const pressure = Math.round(data.main.pressure * 0.02953);
            
            const weatherHTML = `
                <div class="weather-main">
                    <div class="weather-icon">${icon}</div>
                    <div class="temp-display">${temp}</div>
                    <div class="condition-text">${data.weather[0].description}</div>
                    <div class="feels-like">Feels like ${feelsLike}°F</div>
                </div>
                
                <div class="weather-details">
                    <div class="detail-card">
                        <div class="detail-label">Humidity</div>
                        <div class="detail-value">${humidity}%</div>
                    </div>
                    <div class="detail-card">
                        <div class="detail-label">Wind</div>
                        <div class="detail-value">${windSpeed} mph</div>
                    </div>
                    <div class="detail-card">
                        <div class="detail-label">Visibility</div>
                        <div class="detail-value">${visibility} mi</div>
                    </div>
                    <div class="detail-card">
                        <div class="detail-label">Pressure</div>
                        <div class="detail-value">${pressure}"</div>
                    </div>
                </div>
            `;
            
            document.getElementById('weatherContent').innerHTML = weatherHTML;
        }

        // Initialize
        function init() {
            console.log('Initializing Mora Display Combo...');
            updateTime();
            fetchWeatherData();
            
            // Update time every second
            setInterval(updateTime, CONFIG.TIME_UPDATE_INTERVAL);
            
            // Update weather every 5 minutes
            setInterval(fetchWeatherData, CONFIG.WEATHER_UPDATE_INTERVAL);
            
            // Switch layout every 20 minutes
            layoutTimer = setInterval(switchLayout, CONFIG.LAYOUT_SWITCH_INTERVAL);
            
            // Update countdown every second
            countdownTimer = setInterval(updateCountdown, 1000);
            
            console.log('Layout switching enabled: Every 20 minutes for burn-in protection');
        }

        document.addEventListener('DOMContentLoaded', init);

        // Handle visibility changes
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                fetchWeatherData();
            }
        });

        // Auto-reload page daily for kiosk mode stability
        setTimeout(() => {
            window.location.reload();
        }, 24 * 60 * 60 * 1000);
    </script>
</body>
</html>
